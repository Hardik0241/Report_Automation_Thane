name: Report Automation Scheduler - Thane

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs every 30 minutes from 3:00 PM to 9:00 PM IST, Monday-Friday
    # IST 3:00 PM = UTC 09:30, IST 9:00 PM = UTC 15:30
    - cron: '0,30 9-14 * * 1-5'   # Every 30 min: 3:00 PM to 8:30 PM IST
    - cron: '30 15 * * 1-5'       # Final run at 9:00 PM IST (deadline)
  workflow_dispatch:

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          cd "Working_Report_Editor"
          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt found!"
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found!"
            ls -la
            exit 1
          fi

      - name: Create logs directory
        run: |
          mkdir -p "Working_Report_Editor/logs"
          mkdir -p "Working_Report_Editor/attachments"

      - name: Run processor
        run: |
          cd "Working_Report_Editor"
          if [ -f "main.py" ]; then
            echo "✅ main.py found!"
            python main.py
          else
            echo "❌ main.py not found!"
            ls -la
            exit 1
          fi
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY_THANE: ${{ secrets.GEMINI_API_KEY_THANE }}
          THANE_SALES_SPREADSHEET_ID: ${{ secrets.THANE_SALES_SPREADSHEET_ID }}
          THANE_CLIENT_ID: ${{ secrets.THANE_CLIENT_ID }}
          THANE_CLIENT_SECRET: ${{ secrets.THANE_CLIENT_SECRET }}
          THANE_REFRESH_TOKEN: ${{ secrets.THANE_REFRESH_TOKEN }}
